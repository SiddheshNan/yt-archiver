[project]
name = "yt-archiver"
version = "0.1.0"
description = "Self-hosted YouTube archive: save videos to your own server and watch them from a web UI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.8",
    "gunicorn>=23.0.0",
    "pydantic>=2.10.6",
    "pymongo>=4.11.1",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
    "structlog>=25.1.0",
    "uvicorn[standard]>=0.34.0",
    "yt-dlp>=2025.2.19",
    "yt-dlp-ejs>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
yt-archiver = "yt_archiver.main:main"

[project.urls]
Homepage = "https://github.com/SiddheshNan/yt-archiver"
Issues = "https://github.com/SiddheshNan/yt-archiver/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["yt_archiver*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
